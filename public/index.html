<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <!-- When embedded in the 3D portfolio (adamfuzesi.com), hand ESC up to the parent page so
         the camera can step back even while this page holds keyboard focus. -->
    <script>
        (function () {
            if (window.parent === window) return;
            var allowed = ['https://adamfuzesi.com', 'https://www.adamfuzesi.com', 'http://localhost:3000'];
            window.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                allowed.forEach(function (origin) {
                    try { window.parent.postMessage({ type: 'portfolio:escape' }, origin); } catch (err) {}
                });
            });
        })();
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>

</html>
