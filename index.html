<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#008080" />
    <meta name="description" content="AdamOS 98 — the portfolio of Adam Fuzesi, Software Engineer and Computer Science student." />
    <link rel="manifest" href="/manifest.json" />
    <title>AdamOS 98 — Adam Fuzesi</title>

    <!-- When embedded in the 3D portfolio (adamfuzesi.com), hand ESC up to the parent page so
         the camera can step back even while this page holds keyboard focus. -->
    <script>
        (function () {
            if (window.parent === window) return;
            var allowed = ['https://adamfuzesi.com', 'https://www.adamfuzesi.com', 'http://localhost:3000'];
            window.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                allowed.forEach(function (origin) {
                    try { window.parent.postMessage({ type: 'portfolio:escape' }, origin); } catch (err) {}
                });
            });
        })();
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run AdamOS.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
